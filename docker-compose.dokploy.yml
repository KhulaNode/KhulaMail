# Dokploy: select this file, then route your HTTPS domain to frontend:80.
# No host ports or fixed container names; Dokploy owns public TLS/Traefik.
services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_BUILD_SHA: ${GIT_SHA:-khulamail}
        VITE_EMAIL_DIV_RENDER: ${VITE_EMAIL_DIV_RENDER:-false}
        NGINX_BASE: ${NGINX_BASE:-nginx:alpine}
    restart: unless-stopped
    environment:
      NGINX_TLS: "off"
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - app
      - dokploy-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        BUILD_SHA: ${GIT_SHA:-khulamail}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:?Set APP_URL to the public HTTPS origin}
      FRONTEND_URL: ${APP_URL:?Set APP_URL to the public HTTPS origin}
      SESSION_SECRET: ${SESSION_SECRET:?Generate a unique session secret}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Generate a 64-character hex encryption key}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: mailflow
      DB_USER: mailflow
      DB_PASSWORD: ${DB_PASSWORD:?Generate a unique database password}
      REDIS_URL: redis://redis:6379
      # Browser -> Dokploy Traefik -> MailFlow nginx -> backend.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}
      IMAGE_CACHE_DIR: /var/cache/mailflow/images
      IMAGE_CACHE_MAX_MB: ${IMAGE_CACHE_MAX_MB:-512}
      IMAP_MAX_PERSISTENT_PER_HOST: ${IMAP_MAX_PERSISTENT_PER_HOST:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    volumes:
      - image_cache:/var/cache/mailflow/images
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - app

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mailflow
      POSTGRES_USER: mailflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Generate a unique database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailflow -d mailflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - app

volumes:
  postgres_data:
  redis_data:
  image_cache:

networks:
  app:
    driver: bridge
  dokploy-network:
    external: true
    name: ${DOKPLOY_NETWORK:-dokploy-network}
